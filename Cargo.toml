[package]
name = "rotex-d3d12"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Direct3D 12 backend for Rotex"
repository = "https://github.com/rotexengine/rotex-d3d12"

[dependencies]
async-trait = "0.1.89"
rotex-core = { version = "0.2.0" }
rotex-types = { version = "0.2.0" }

[dev-dependencies]
pollster = "0.4.0"
rotex-conformance = { version = "0.2.0" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
