[package]
name = "rotex-d3d12"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Direct3D 12 backend for Rotex"
documentation = "https://docs.rs/rotex-d3d12"
repository = "https://github.com/rotex-labs/rotex-d3d12"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
async-trait = "0.1.89"
rotex-core = "0.3.0"
rotex-types = "0.3.0"

[dev-dependencies]
pollster = "0.4.0"
rotex-conformance = "0.3.0"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
